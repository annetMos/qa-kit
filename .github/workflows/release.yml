name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC) — no npm token is stored

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Staged publishing needs npm 11.15.0+, Node 22 ships npm 10
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Type check and run tests
        run: |
          npx playwright install --with-deps chromium
          npm run check

      - name: Check tag matches package version
        id: version
        run: |
          VERSION="$(node -p "require('./packages/core/package.json').version")"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$VERSION"
            exit 1
          fi
          if npm view "@qa-kit/core@$VERSION" version >/dev/null 2>&1; then
            echo "@qa-kit/core@$VERSION is already on npm — skipping publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # The release is staged, not published: a maintainer approves it on npmjs.com
      # (Staged Packages tab) or with `npm stage approve <id>` — both require 2FA.
      # `npm stage` is unaware of workspaces, so it runs inside the package folder.
      - name: Stage @qa-kit/core for approval
        if: steps.version.outputs.published != 'true'
        working-directory: packages/core
        run: npm stage publish --access public
